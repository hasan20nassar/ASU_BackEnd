openapi: 3.0.3
info:
  title: Antioch Syrian Private University (ASU) API
  version: 1.0.0
  description: API documentation for ASU portal web application.
paths:
  /api/alumni-stories/:
    get:
      operationId: alumni_stories_list
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - alumni-stories
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniStory'
          description: ''
    post:
      operationId: alumni_stories_create
      tags:
      - alumni-stories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumniStory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlumniStory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlumniStory'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniStory'
          description: ''
  /api/alumni-stories/{id}/:
    get:
      operationId: alumni_stories_retrieve
      parameters:
