components:
  schemas:
    AlumniStory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        faculty:
          type: integer
        facultySlug:
          type: string
          readOnly: true
        nameAr:
          type: string
        nameEn:
          type: string
        graduationYear:
          type: integer
        programAr:
          type: string
        programEn:
          type: string
        currentRoleAr:
          type: string
        currentRoleEn:
          type: string
        companyAr:
          type: string
        companyEn:
          type: string
        storyAr:
          type: string
        storyEn:
          type: string
        image:
          type: string
          title: Image Path
          maxLength: 255
      required:
      - companyAr
      - companyEn
      - currentRoleAr
      - currentRoleEn
      - faculty
      - facultySlug
      - graduationYear
      - id
      - image
      - nameAr
      - nameEn
      - programAr
      - programEn
      - storyAr
      - storyEn
    BranchEnum:
      enum:
      - scientific
      - literary
      - both
      type: string
      description: |-
        * `scientific` - Scientific
        * `literary` - Literary
        * `both` - Both
    CategoryEnum:
      enum:
      - announcement
      - event
      - achievement
      - research
      type: string
      description: |-
        * `announcement` - Announcement
        * `event` - Event
        * `achievement` - Achievement
        * `research` - Research
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: Course Code
          maxLength: 50
        nameAr:
          type: string
        nameEn:
          type: string
