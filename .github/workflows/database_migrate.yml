name: Apply Database Migrations to Neon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'university/migrations/**'
      - 'university/models.py'

jobs:
  migrate:
    name: Run Migrations on Neon DB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-migration-runner-key' }}
          DEBUG: 'False'
        run: |
          python manage.py migrate --no-input

      - name: Seed Initial Data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-migration-runner-key' }}
          DEBUG: 'False'
        run: |
          python manage.py seed_db || echo "Seed skipped or already applied"
